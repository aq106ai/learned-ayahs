name: Video maker samples

# Draws every "Share as video" background, previews in each shape and one real video on an
# emulator, and commits the pictures to android-app-quran-player/store/raw/video-maker/ for review
# (the sample video itself is kept out of git; it is in the run's artifacts). Run it from the
# Actions tab after changing anything under video/.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, dev]
    paths:
      - .github/workflows/video-samples.yml
      - android-app-quran-player/store/capture-video-samples.sh
      - android-app-quran-player/app/src/androidTest/java/com/quran/learnedplayer/VideoSamples.kt

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samples:
    name: Draw the video maker samples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        working-directory: android-app-quran-player
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Draw
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: android-app-quran-player
          script: SKIP_BUILD=1 bash store/capture-video-samples.sh store/raw/video-maker

      - name: Keep the sample video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-maker-sample
          path: android-app-quran-player/store/raw/video-maker/*.mp4
          retention-days: 14

      - name: Commit the samples
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app-quran-player/store/raw/video-maker || true
          if git diff --cached --quiet; then echo "Samples unchanged"; exit 0; fi
          git commit -m "Video maker samples: drawn at ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
