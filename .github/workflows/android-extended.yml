name: Android extended checks

# Slower checks that need an emulator or a full lint pass. They run on pull requests into main
# and can be started by hand from the Actions tab ("Run workflow") on any branch.
#
# Known state: on a fresh API 34 emulator most of WordByWordTest and one FreshInstallTest case
# fail (no crash or ANR) and need investigating on a device before this job can gate merges.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented tests (emulator, API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-app-quran-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # FullSurahRecitationTest is excluded: it plays recitation aloud into a physical
      # microphone and needs the phone's Arabic speech service, neither of which an emulator
      # has. Run it on a real device with tools/device-test.ps1.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Animations stay on: the app's own on-device test runs keep them, and the word
          # reader's pager is exercised with them enabled.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: android-app-quran-player
          script: |
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.quran.learnedplayer.FullSurahRecitationTest || touch "$RUNNER_TEMP/instrumented-failed"
            adb logcat -d -b main,system,crash > "$RUNNER_TEMP/logcat.txt" || true

      # The HTML report is uploaded below, but failures are also printed here so they can be
      # read straight from the job log.
      - name: Report instrumented test results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET
          total = failed = 0
          for path in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  total += 1
                  for failure in case.findall("failure"):
                      failed += 1
                      trace = (failure.text or "").strip().splitlines()
                      print(f"::group::FAILED {case.get('classname')}.{case.get('name')}")
                      print("\n".join(trace[:250]))
                      print("::endgroup::")
          print(f"{total - failed}/{total} instrumented tests passed")
          log = os.path.join(os.environ["RUNNER_TEMP"], "logcat.txt")
          if os.path.exists(log):
              lines = open(log, errors="replace").read().splitlines()
              hits = [i for i, l in enumerate(lines) if "FATAL EXCEPTION" in l or "ANR in" in l]
              print(f"::group::logcat: {len(hits)} crash/ANR markers")
              for i in hits[:5]:
                  print("\n".join(lines[i:i + 30]))
                  print("-----")
              print("::endgroup::")
          EOF
          test ! -f "$RUNNER_TEMP/instrumented-failed"

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: android-app-quran-player/app/build/reports/androidTests/
          retention-days: 14

  lint:
    name: Android Lint (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app-quran-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Report-only for now: the existing findings (Media3 @UnstableApi opt-ins and API-level
      # annotations on code that is already guarded at runtime) are listed in the run summary.
      # Once they are fixed, make the summary step fail on errors to keep the count at zero.
      - name: Run lint
        run: ./gradlew lintDebug || true

      - name: Summarise lint results
        run: |
          python3 - <<'EOF'
          import os, sys, xml.etree.ElementTree as ET
          path = "app/build/reports/lint-results-debug.xml"
          issues = ET.parse(path).getroot().findall("issue")
          counts = {}
          lines = ["| Severity | Id | Location | Message |", "|---|---|---|---|"]
          for i in issues:
              sev = i.get("severity")
              counts[sev] = counts.get(sev, 0) + 1
              loc = i.find("location")
              where = ""
              if loc is not None:
                  where = loc.get("file", "").split("android-app-quran-player/")[-1]
                  if loc.get("line"):
                      where += ":" + loc.get("line")
              msg = i.get("message", "").replace("|", "\\|")
              lines.append(f"| {sev} | {i.get('id')} | {where} | {msg} |")
          summary = "## Android Lint\n\n" + (", ".join(f"{k}: {v}" for k, v in sorted(counts.items())) or "No issues") + "\n\n" + "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)
          for sev in ("Fatal", "Error"):
              if counts.get(sev):
                  print(f"::warning title=Android Lint::{counts[sev]} {sev.lower()}-severity issues (see the run summary)")
          EOF

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-app-quran-player/app/build/reports/lint-results-debug.*
          retention-days: 14
