<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learned Ayahs — Maher Al Muaiqly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a1710;
      --panel: #112a1c;
      --text: #e6f4eb;
      --muted: #8db29b;
      --accent: #27ae60;
      --accent-2: #45d483;
      --border: #1f4030;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #143322, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 6px; font-size: 1.55rem; color: var(--text); }
    .sub { color: var(--muted); margin-bottom: 16px; font-size: 0.95rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .panel.compact { padding: 10px 14px; }
    .now { font-size: 1.15rem; font-weight: 600; }
    .meta { color: var(--muted); margin-top: 4px; font-size: 0.9rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; direction: ltr; }
    button, .file-btn {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button.secondary, .file-btn.secondary { background: #1f4030; color: var(--text); }
    button.active-mode { background: var(--accent-2); color: #0a1710; font-weight: 600; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .mode-hint {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #0f2218;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .mode-hint.active { color: #b8f0c8; border: 1px solid #45d48344; }
    #playerPanel.panel-ready { cursor: pointer; }
    #playerPanel.panel-ready:hover { border-color: #45d48388; }
    .seek-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
    input[type="range"] { width: 100%; margin-top: 10px; accent-color: var(--accent-2); }
    .ayah-text {
      font-family: "Amiri Quran", "Traditional Arabic", serif;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      line-height: 2.2;
      text-align: center;
      padding: 16px 8px;
      min-height: 100px;
      direction: rtl;
    }
    .ayah-text .word {
      display: inline-block;
      padding: 2px 6px;
      margin: 0 2px;
      border-radius: 8px;
      transition: background 0.12s, color 0.12s, transform 0.12s;
    }
    .ayah-text .word.done { color: var(--muted); }
    .ayah-text .word.active {
      background: var(--accent-2);
      color: #0a1710;
      transform: scale(1.06);
      font-weight: 700;
    }
    .ayah-text .word.pending { color: var(--text); }
    .ayah-text .end-mark { color: var(--muted); font-size: 0.85em; }
    .ayah-note { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 6px; }
    .list-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .list {
      max-height: 360px;
      overflow: auto;
      border-top: 1px solid var(--border);
      margin-top: 8px;
      transition: max-height 0.25s ease;
    }
    .list.expanded { max-height: min(70vh, 720px); }
    .surah-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 4px 8px;
      margin-top: 8px;
      border-top: 1px solid var(--border);
      scrollbar-width: thin;
      direction: ltr;
    }
    .surah-nav::-webkit-scrollbar { height: 6px; }
    .surah-chip {
      flex-shrink: 0;
      min-width: auto;
      padding: 6px 12px;
      border-radius: 999px;
      background: #0f2218;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .surah-chip:hover { background: #0d1e15; color: var(--text); }
    .surah-chip.active {
      background: var(--accent-2);
      color: #0a1710;
      border-color: var(--accent-2);
      font-weight: 600;
    }
    .surah-group-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #142b1f;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--accent-2);
      cursor: pointer;
    }
    .surah-group-header.active-surah {
      background: #1a3828;
      box-shadow: inset 3px 0 0 var(--accent-2);
    }
    .surah-group-header .surah-title { color: var(--text); }
    .surah-group-header .badge { font-weight: 400; }
    .track {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 8px;
      border-bottom: 1px solid #0f2218;
      cursor: pointer;
    }
    .track.active { background: #0f2218; color: var(--accent-2); }
    .track.grouped { padding-left: 16px; }
    .track:hover { background: #0d1e15; }
    .badge {
      display: inline-block;
      background: #0f2218;
      color: var(--muted);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.78rem;
    }
    .compact-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; direction: ltr; }
    .compact-bar .info { flex: 1; min-width: 140px; }
    .hidden { display: none !important; }
    #loadStatus { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    .ayah-panel-head {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .ayah-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top, #143322, var(--bg));
      color: var(--text);
    }
    .ayah-fullscreen-meta {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      direction: ltr;
      text-align: center;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 8px;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .ayah-fullscreen-meta .meta-label {
      flex: 1;
      text-align: center;
    }
    .ayah-fullscreen-meta button {
      flex-shrink: 0;
    }
    .ayah-fullscreen-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 12px;
      overflow: auto;
      min-height: 0;
    }
    .ayah-fullscreen-body.panel-ready { cursor: pointer; }
    .ayah-fullscreen .ayah-text {
      font-size: clamp(2rem, 7vw, 3.4rem);
      line-height: 2.35;
      min-height: 0;
      width: 100%;
      max-width: 1100px;
    }
    .ayah-fullscreen-controls {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      background: rgba(10, 23, 16, 0.92);
      direction: ltr;
    }
    .ayah-fullscreen-controls button {
      min-width: 110px;
      padding: 12px 18px;
      font-size: 1rem;
    }
    body.text-fullscreen-active { overflow: hidden; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Learned Ayahs</h1>
    <p class="sub">Maher Al Muaiqly · v2.5 · gapless · exact word sync</p>

    <div class="panel" id="loadPanel">
      <div class="controls">
        <label class="file-btn secondary">
          Pick library JSON
          <input type="file" id="libraryFile" accept=".json,application/json" hidden>
        </label>
        <button id="useEmbeddedBtn" class="secondary">Use built-in playlist</button>
      </div>
      <div id="loadStatus">Load your quran_library export or use the built-in playlist.</div>
    </div>

    <div id="mainUi" class="hidden">
      <div class="panel" id="playerPanel">
        <div class="now" id="nowPlaying">Ready</div>
        <div class="meta" id="trackMeta"></div>
        <input type="range" id="seek" min="0" max="1000" value="0">
        <div class="seek-row"><span id="timeNow">0:00</span><span id="timeTotal">0:00</span></div>
        <div class="mode-grid" id="modeGrid"></div>
        <div class="mode-hint" id="modeHint"></div>
        <div class="controls">
          <button id="prevBtn" class="secondary">Previous</button>
          <button id="playBtn">Play</button>
          <button id="pauseBtn" class="secondary">Pause</button>
          <button id="nextBtn" class="secondary">Next</button>
        </div>
      </div>

      <div class="panel" id="ayahPanel">
        <div class="ayah-panel-head">
          <button id="textFullscreenBtn" class="secondary" type="button">Fullscreen text</button>
        </div>
        <div class="ayah-text" id="ayahText"><span class="word pending">…</span></div>
        <div class="ayah-note" id="ayahNote">Word highlight synced to recitation when timing data is available.</div>
      </div>

      <div id="ayahFullscreen" class="ayah-fullscreen hidden" aria-hidden="true">
        <div id="ayahFullscreenMeta" class="ayah-fullscreen-meta">
          <span id="ayahFullscreenMetaText" class="meta-label"></span>
          <button id="fsExitBtn" class="secondary" type="button">Exit fullscreen</button>
        </div>
        <div class="ayah-fullscreen-body" id="ayahFullscreenBody"></div>
        <div class="ayah-fullscreen-controls">
          <button id="fsPrevBtn" class="secondary" type="button">Previous</button>
          <button id="fsPauseBtn" type="button">Pause</button>
          <button id="fsNextBtn" class="secondary" type="button">Next</button>
        </div>
      </div>

      <div class="panel compact hidden" id="compactBar">
        <div class="compact-bar">
          <div class="info">
            <div class="now" id="compactTitle">—</div>
            <div class="meta" id="compactMeta">—</div>
          </div>
          <button class="secondary" id="compactPrev">Prev</button>
          <button id="compactPlay">Play</button>
          <button class="secondary" id="compactNext">Next</button>
        </div>
      </div>

      <div class="panel" id="playlistPanel">
        <div class="list-header">
          <div><strong>Playlist</strong> <span class="badge" id="countBadge">0</span></div>
          <div class="controls" style="margin:0">
            <button id="expandBtn" class="secondary">Expand</button>
            <button id="refreshBtn" class="secondary">Refresh list</button>
          </div>
        </div>
        <div id="surahNav" class="surah-nav hidden" aria-label="Jump to surah"></div>
        <div class="list" id="trackList"></div>
      </div>
    </div>
  </div>

  <script id="playlist-data" type="application/json">__PLAYLIST__</script>
  <script>
    const VERSE_COUNTS = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
    const SURAH_NAMES = [
      "Al-Fatihah", "Al-Baqarah", "Al-Imran", "An-Nisa", "Al-Maidah", "Al-Anam", "Al-Araf", "Al-Anfal",
      "At-Tawbah", "Yunus", "Hud", "Yusuf", "Ar-Raad", "Ibrahim", "Al-Hijr", "An-Nahl", "Al-Isra", "Al-Kahf",
      "Maryam", "Ta-Ha", "Al-Anbiya", "Al-Hajj", "Al-Muminun", "An-Nur", "Al-Furqan", "Ash-Shuara", "An-Naml",
      "Al-Qasas", "Al-Ankabut", "Ar-Rum", "Luqman", "As-Sajdah", "Al-Ahzab", "Saba", "Fatir", "Ya-Sin",
      "As-Saffat", "Sad", "Az-Zumar", "Ghafir", "Fussilat", "Ash-Shura", "Az-Zukhruf", "Ad-Dukhan",
      "Al-Jathiyah", "Al-Ahqaf", "Muhammad", "Al-Fath", "Al-Hujurat", "Qaf", "Adh-Dhariyat", "At-Tur", "An-Najm",
      "Al-Qamar", "Ar-Rahman", "Al-Waqiah", "Al-Hadid", "Al-Mujadila", "Al-Hashr", "Al-Mumtahanah", "As-Saff",
      "Al-Jumuah", "Al-Munafiqun", "At-Taghabun", "At-Talaq", "At-Tahrim", "Al-Mulk", "Al-Qalam", "Al-Haqqah",
      "Al-Maarij", "Nuh", "Al-Jinn", "Al-Muzzammil", "Al-Muddaththir", "Al-Qiyamah", "Al-Insan", "Al-Mursalat",
      "An-Naba", "An-Naziat", "Abasa", "At-Takwir", "Al-Infitar", "Al-Mutaffifin", "Al-Inshiqaq", "Al-Buruj",
      "At-Tariq", "Al-Ala", "Al-Ghashiyah", "Al-Fajr", "Al-Balad", "Ash-Shams", "Al-Layl", "Ad-Duha", "Ash-Sharh",
      "At-Tin", "Al-Alaq", "Al-Qadr", "Al-Bayyinah", "Az-Zalzalah", "Al-Adiyat", "Al-Qariah", "At-Takathur",
      "Al-Asr", "Al-Humazah", "Al-Fil", "Quraysh", "Al-Maun", "Al-Kawthar", "Al-Kafirun", "An-Nasr", "Al-Masad",
      "Al-Ikhlas", "Al-Falaq", "An-Nas",
    ];
    const MODES = {
      continuous: { label: "Continuous", hint: "All learned ayahs play automatically in order." },
      revision: { label: "Revision", hint: "Current ayah repeats. Click the panel or Next to advance." },
      surah: { label: "Surah loop", hint: "Whole surah loops. Next/Prev jump to another surah (streams online)." },
      surah_learned: { label: "Surah learned", hint: "Only this surah's learned ayahs loop. Next/Prev jump surahs." },
    };
    const RECITER_FOLDER = "MaherAlMuaiqly128kbps";
    const AUDHU_FILE = `audio/${RECITER_FOLDER}/audhubillah.mp3`;
    const AUDHU_REMOTE = "https://everyayah.com/data/audhubillah.mp3";
    const BISMILLAH_FILE = `audio/${RECITER_FOLDER}/bismillah.mp3`;
    const BISMILLAH_REMOTE = "https://everyayah.com/data/bismillah.mp3";
    const QUL_RECITATION_ID = 13;
    const QUL_SEGMENTS_PAGE = 11;

    // Always included even when absent from the library JSON export.
    const FULL_DEFAULT_SURAHS = [36, 55, 56, 61, 62, 67, ...Array.from({ length: 45 }, (_, i) => 70 + i)];
    const DEFAULT_PARTIAL_SURAHS = { 69: [1, 43] };

    function defaultSupplementTracks() {
      const tracks = [];
      for (const surah of FULL_DEFAULT_SURAHS) {
        const count = VERSE_COUNTS[surah - 1];
        for (let ayah = 1; ayah <= count; ayah++) {
          tracks.push({
            global_id: surahAyahToGlobal(surah, ayah),
            surah,
            ayah,
            label: `Surah ${surah} : Ayah ${ayah}`,
            file: ayahFile(surah, ayah),
          });
        }
      }
      for (const [surah, [start, end]] of Object.entries(DEFAULT_PARTIAL_SURAHS)) {
        for (let ayah = start; ayah <= end; ayah++) {
          tracks.push({
            global_id: surahAyahToGlobal(Number(surah), ayah),
            surah: Number(surah),
            ayah,
            label: `Surah ${surah} : Ayah ${ayah}`,
            file: ayahFile(Number(surah), ayah),
          });
        }
      }
      return tracks;
    }

    function mergeDefaultTracks(tracks) {
      const byGid = new Map(tracks.map(t => [t.global_id, t]));
      for (const entry of defaultSupplementTracks()) {
        if (!byGid.has(entry.global_id)) byGid.set(entry.global_id, entry);
      }
      return [...byGid.values()].sort((a, b) => a.global_id - b.global_id);
    }

    const audioA = new Audio();
    const audioB = new Audio();
    audioA.preload = "auto";
    audioB.preload = "auto";

    let masterPlaylist = [];
    let playlist = [];
    let index = 0;
    let active = audioA;
    let standby = audioB;
    let playing = false;
    let mode = "continuous";
    let currentSurah = 1;
    let playlistExpanded = false;
    let quranText = {};
    let wordTimingsData = {};
    let wordTimings = [];
    let wordEls = [];
    let syncExact = false;
    let textFullscreen = false;
    let loadedTrackIndex = -1;
    let introInProgress = false;
    let introPhase = null;
    let surahNavObserver = null;

    function needsSurahIntro(track) {
      return track && track.ayah === 1;
    }

    function isIntroSource(src) {
      if (typeof src !== "string") return false;
      return src.includes("audhubillah") || src.includes("bismillah");
    }

    function setIntroUi(label) {
      nowPlaying.textContent = label;
      trackMeta.textContent = playlist[index]
        ? `Starting ${surahTitle(playlist[index].surah)}`
        : label;
      updateFullscreenMeta();
    }

    const $ = (id) => document.getElementById(id);
    const nowPlaying = $("nowPlaying");
    const trackMeta = $("trackMeta");
    const seek = $("seek");
    const trackList = $("trackList");
    const surahNav = $("surahNav");
    const countBadge = $("countBadge");
    const modeHint = $("modeHint");
    const playerPanel = $("playerPanel");
    const ayahText = $("ayahText");
    const mainUi = $("mainUi");
    const loadStatus = $("loadStatus");
    const compactBar = $("compactBar");
    const fullPlayerPanel = $("playerPanel");
    const ayahPanel = $("ayahPanel");
    const ayahFullscreen = $("ayahFullscreen");
    const ayahFullscreenBody = $("ayahFullscreenBody");
    const ayahFullscreenMeta = $("ayahFullscreenMeta");
    const ayahFullscreenMetaText = $("ayahFullscreenMetaText");
    const fsPauseBtn = $("fsPauseBtn");

    function updateFullscreenMeta() {
      if (!ayahFullscreenMetaText) return;
      if (introPhase === "audhu") {
        ayahFullscreenMetaText.textContent = "A'udhu Billah";
        return;
      }
      if (introPhase === "bismillah") {
        ayahFullscreenMetaText.textContent = "Bismillah";
        return;
      }
      const track = playlist[index];
      ayahFullscreenMetaText.textContent = track ? `${surahTitle(track.surah)} · Ayah ${track.ayah}` : "";
    }

    function surahName(surah) {
      return SURAH_NAMES[surah - 1] || `Surah ${surah}`;
    }

    function surahLabel(surah) {
      return `${surah} · ${surahName(surah)}`;
    }

    function surahTitle(surah) {
      return `Surah ${surah} · ${surahName(surah)}`;
    }

    function updatePauseButtons() {
      if (fsPauseBtn) fsPauseBtn.textContent = playing ? "Pause" : "Play";
    }

    function enterTextFullscreen() {
      if (textFullscreen || !mainUi || mainUi.classList.contains("hidden")) return;
      ayahFullscreenBody.appendChild(ayahText);
      ayahFullscreen.classList.remove("hidden");
      ayahFullscreen.setAttribute("aria-hidden", "false");
      document.body.classList.add("text-fullscreen-active");
      textFullscreen = true;
      ayahFullscreenBody.classList.toggle("panel-ready", fullscreenTapAdvances());
      updateFullscreenMeta();
      updatePauseButtons();
    }

    function exitTextFullscreen() {
      if (!textFullscreen) return;
      ayahPanel.appendChild(ayahText);
      ayahFullscreenBody.classList.remove("panel-ready");
      ayahFullscreen.classList.add("hidden");
      ayahFullscreen.setAttribute("aria-hidden", "true");
      document.body.classList.remove("text-fullscreen-active");
      textFullscreen = false;
    }

    function togglePlayPause() {
      if (playing) {
        active.pause();
        playing = false;
        updatePauseButtons();
      } else {
        startPlayback();
      }
    }

    function surahAyahToGlobal(surah, ayah) {
      let total = 0;
      for (let i = 0; i < surah - 1; i++) total += VERSE_COUNTS[i];
      return total + ayah;
    }

    function learnedSurahs(master) {
      return [...new Set(master.map(t => t.surah))].sort((a, b) => a - b);
    }

    function ayahFile(surah, ayah) {
      return `audio/${RECITER_FOLDER}/${String(surah).padStart(3, "0")}${String(ayah).padStart(3, "0")}.mp3`;
    }

    function surahAllAyahs(surah) {
      const count = VERSE_COUNTS[surah - 1] || 0;
      return Array.from({ length: count }, (_, i) => {
        const ayah = i + 1;
        return {
          surah, ayah,
          global_id: surahAyahToGlobal(surah, ayah),
          label: `Surah ${surah} : Ayah ${ayah}`,
          file: ayahFile(surah, ayah),
        };
      });
    }

    function buildQueue(master, m, surah) {
      if (m === "continuous" || m === "revision") return master.slice();
      if (m === "surah") return surahAllAyahs(surah);
      if (m === "surah_learned") return master.filter(t => t.surah === surah);
      return master.slice();
    }

    function nextSurah(master, surah) {
      const list = learnedSurahs(master);
      if (!list.length) return surah;
      const idx = list.indexOf(surah);
      return list[(idx === -1 ? 0 : idx + 1) % list.length];
    }

    function prevSurah(master, surah) {
      const list = learnedSurahs(master);
      if (!list.length) return surah;
      const idx = list.indexOf(surah);
      return list[(idx === -1 ? list.length - 1 : idx - 1 + list.length) % list.length];
    }

    function isSurahMode() { return mode === "surah" || mode === "surah_learned"; }
    function isRevisionLike() { return mode === "revision"; }
    function shouldLoopQueue() { return isSurahMode(); }
    function panelAdvances() { return mode !== "continuous"; }
    function fullscreenTapAdvances() { return mode === "revision"; }

    function swapPlayers() {
      const tmp = active; active = standby; standby = tmp;
    }

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) return "0:00";
      const s = Math.floor(sec);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }

    function trackLabel(track, i) {
      return `${i + 1}. ${surahTitle(track.surah)} · Ayah ${track.ayah}`;
    }

    function renderModeButtons() {
      const grid = $("modeGrid");
      grid.innerHTML = "";
      Object.entries(MODES).forEach(([key, cfg]) => {
        const btn = document.createElement("button");
        btn.textContent = cfg.label;
        btn.className = key === mode ? "active-mode" : "secondary";
        btn.onclick = () => setMode(key);
        grid.appendChild(btn);
      });
    }

    function updateModeUi() {
      const cfg = MODES[mode];
      modeHint.textContent = cfg.hint;
      modeHint.classList.toggle("active", mode !== "continuous");
      playerPanel.classList.toggle("panel-ready", panelAdvances());
      ayahFullscreenBody?.classList.toggle("panel-ready", fullscreenTapAdvances() && textFullscreen);
      renderModeButtons();
    }

    function setActiveQueue(queue, startIdx = 0) {
      playlist = queue.length ? queue : masterPlaylist.slice();
      index = Math.max(0, Math.min(startIdx, playlist.length - 1));
      if (playlist[index]) currentSurah = playlist[index].surah;
      updateUi();
      loadActiveTrack();
    }

    function setMode(newMode) {
      mode = newMode;
      const track = playlist[index] || masterPlaylist[0];
      const surah = track?.surah || learnedSurahs(masterPlaylist)[0] || 1;
      const globalId = track?.global_id;
      const queue = buildQueue(masterPlaylist, mode, surah);
      let startIdx = 0;
      if (globalId) {
        const found = queue.findIndex(t => t.global_id === globalId);
        if (found >= 0) startIdx = found;
      }
      updateModeUi();
      setActiveQueue(queue, startIdx);
      primeStandby(index + 1);
    }

    function reloadSurah(newSurah) {
      currentSurah = newSurah;
      const queue = buildQueue(masterPlaylist, mode, currentSurah);
      setActiveQueue(queue, 0);
      playIndex(0, playing);
    }

    function usesSurahGroupedList() {
      return mode === "continuous" || mode === "revision";
    }

    function playlistSurahs() {
      const surahs = [];
      let last = null;
      for (const track of playlist) {
        if (track.surah !== last) {
          surahs.push(track.surah);
          last = track.surah;
        }
      }
      return surahs;
    }

    function firstIndexForSurah(surah) {
      return playlist.findIndex(t => t.surah === surah);
    }

    function ayahCountInSurah(surah) {
      let count = 0;
      for (const track of playlist) {
        if (track.surah === surah) count += 1;
      }
      return count;
    }

    function highlightSurahNav(surah, scrollChip = false) {
      if (!surahNav || !usesSurahGroupedList()) return;
      surahNav.querySelectorAll(".surah-chip").forEach(chip => {
        chip.classList.toggle("active", Number(chip.dataset.surah) === surah);
      });
      trackList.querySelectorAll(".surah-group-header").forEach(header => {
        header.classList.toggle("active-surah", Number(header.dataset.surah) === surah);
      });
      if (scrollChip) {
        const activeChip = surahNav.querySelector(`.surah-chip[data-surah="${surah}"]`);
        activeChip?.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
      }
    }

    function scrollToSurah(surah) {
      const header = trackList.querySelector(`.surah-group-header[data-surah="${surah}"]`);
      if (header) {
        header.scrollIntoView({ block: "start", behavior: "smooth" });
        highlightSurahNav(surah, true);
      }
    }

    function setupSurahScrollSpy() {
      if (surahNavObserver) {
        surahNavObserver.disconnect();
        surahNavObserver = null;
      }
      if (!usesSurahGroupedList()) return;
      const headers = trackList.querySelectorAll(".surah-group-header");
      if (!headers.length) return;
      surahNavObserver = new IntersectionObserver((entries) => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
        if (!visible.length) return;
        const surah = Number(visible[0].target.dataset.surah);
        highlightSurahNav(surah, true);
      }, { root: trackList, threshold: [0, 0.25, 0.75, 1] });
      headers.forEach(header => surahNavObserver.observe(header));
    }

    function renderSurahNav() {
      if (!surahNav) return;
      if (!usesSurahGroupedList()) {
        surahNav.classList.add("hidden");
        surahNav.innerHTML = "";
        return;
      }
      surahNav.classList.remove("hidden");
      surahNav.innerHTML = "";
      const currentSurah = playlist[index]?.surah;
      for (const surah of playlistSurahs()) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "surah-chip" + (surah === currentSurah ? " active" : "");
        chip.dataset.surah = String(surah);
        chip.textContent = surahLabel(surah);
        chip.title = `Jump to ${surahTitle(surah)}`;
        chip.onclick = () => scrollToSurah(surah);
        surahNav.appendChild(chip);
      }
    }

    function renderFlatList() {
      playlist.forEach((track, i) => {
        const row = document.createElement("div");
        row.className = "track" + (i === index ? " active" : "");
        row.innerHTML = `<span>${trackLabel(track, i)}</span><span>#${track.global_id}</span>`;
        row.onclick = () => playIndex(i);
        trackList.appendChild(row);
      });
    }

    function renderGroupedList() {
      let currentSurah = null;
      playlist.forEach((track, i) => {
        if (track.surah !== currentSurah) {
          currentSurah = track.surah;
          const header = document.createElement("div");
          header.className = "surah-group-header" + (track.surah === playlist[index]?.surah ? " active-surah" : "");
          header.dataset.surah = String(currentSurah);
          header.innerHTML = `<span class="surah-title">${surahTitle(currentSurah)}</span><span class="badge">${ayahCountInSurah(currentSurah)} ayahs</span>`;
          header.onclick = () => playIndex(i);
          trackList.appendChild(header);
        }
        const row = document.createElement("div");
        row.className = "track grouped" + (i === index ? " active" : "");
        row.innerHTML = `<span>Ayah ${track.ayah}</span><span>#${track.global_id}</span>`;
        row.onclick = () => playIndex(i);
        trackList.appendChild(row);
      });
    }

    function renderList() {
      trackList.innerHTML = "";
      if (usesSurahGroupedList()) {
        renderGroupedList();
        renderSurahNav();
        setupSurahScrollSpy();
        highlightSurahNav(playlist[index]?.surah, true);
      } else {
        renderFlatList();
        if (surahNav) {
          surahNav.classList.add("hidden");
          surahNav.innerHTML = "";
        }
        if (surahNavObserver) {
          surahNavObserver.disconnect();
          surahNavObserver = null;
        }
      }
      countBadge.textContent = playlist.length;
      trackList.classList.toggle("expanded", playlistExpanded);
    }

    function verseKey(track) {
      return `${track.surah}:${track.ayah}`;
    }

    async function loadQuranText() {
      try {
        const res = await fetch("quran_text.json");
        if (res.ok) quranText = await res.json();
      } catch (_) { /* offline or missing */ }
    }

    async function loadWordTimings() {
      try {
        const res = await fetch("word_timings.json");
        if (res.ok) wordTimingsData = await res.json();
      } catch (_) { /* offline or missing */ }
    }

    function updateSyncNote() {
      const note = $("ayahNote");
      if (!note) return;
      note.textContent = syncExact
        ? "Word highlight synced to recitation (exact timing)."
        : "Word highlight follows recitation pace (approximate sync).";
    }

    function qulPageStart(ayah) {
      return Math.floor((ayah - 1) / QUL_SEGMENTS_PAGE) * QUL_SEGMENTS_PAGE + 1;
    }

    async function ensureWordTimings(track) {
      const key = verseKey(track);
      if (wordTimingsData[key]?.segments?.length) return true;
      const fromAyah = qulPageStart(track.ayah);
      try {
        const url = `https://qul.tarteel.ai/api/v1/audio/ayah_segments/${QUL_RECITATION_ID}?surah=${track.surah}&from=${fromAyah}`;
        const res = await fetch(url);
        if (!res.ok) return false;
        const data = await res.json();
        for (const [entryKey, entry] of Object.entries(data.segments || {})) {
          const raw = entry.segments || [];
          if (!raw.length) continue;
          wordTimingsData[entryKey] = {
            segments: raw
              .slice()
              .sort((a, b) => a[0] - b[0])
              .map((seg) => [seg[2], seg[3]]),
          };
        }
      } catch (_) {
        return false;
      }
      return !!wordTimingsData[key]?.segments?.length;
    }

    function applyExactTimings(key) {
      const exact = wordTimingsData[key];
      if (!exact?.segments?.length) return false;
      wordTimings = exact.segments.map((seg, i) => ({
        start: seg[0] / 1000,
        end: seg[1] / 1000,
        idx: i,
      }));
      syncExact = true;
      updateSyncNote();
      return true;
    }

    function renderAyahText(track) {
      wordTimings = [];
      wordEls = [];
      if (!track) {
        ayahText.innerHTML = '<span class="word pending">—</span>';
        return;
      }
      const entry = quranText[verseKey(track)];
      if (!entry || !entry.words?.length) {
        ayahText.innerHTML = '<span class="word pending">Loading text…</span>';
        fetchVerseText(track);
        return;
      }
      ayahText.innerHTML = "";
      entry.words.forEach((w, i) => {
        const span = document.createElement("span");
        if (w.char_type === "end") {
          span.className = "end-mark";
          span.textContent = " " + w.text;
        } else {
          span.className = "word pending";
          span.textContent = w.text;
          span.dataset.idx = i;
          wordEls.push(span);
        }
        ayahText.appendChild(span);
      });
    }

    async function fetchVerseText(track) {
      const key = verseKey(track);
      if (quranText[key]) return renderAyahText(track);
      try {
        const res = await fetch(`https://api.qurancdn.com/api/qdc/verses/by_key/${key}?words=true&word_fields=text_uthmani`);
        if (!res.ok) throw new Error("fetch failed");
        const data = await res.json();
        quranText[key] = {
          words: (data.verse?.words || []).map(w => ({
            position: w.position,
            text: w.text_uthmani || w.text,
            char_type: w.char_type_name === "end" ? "end" : "word",
          })),
        };
        renderAyahText(track);
      } catch (_) {
        ayahText.innerHTML = '<span class="word pending">Could not load ayah text</span>';
      }
    }

    async function computeWordTimings(duration) {
      const track = playlist[index];
      if (!track) return;
      const key = verseKey(track);
      if (applyExactTimings(key)) return;
      if (await ensureWordTimings(track) && applyExactTimings(key)) return;

      const entry = quranText[key];
      if (!entry) return;
      const words = entry.words.filter(w => w.char_type !== "end");
      if (!words.length || !duration) { wordTimings = []; syncExact = false; updateSyncNote(); return; }
      const weights = words.map(w => Math.max(1, [...w.text].length));
      const total = weights.reduce((a, b) => a + b, 0);
      const leadIn = duration * 0.04;
      const leadOut = duration * 0.03;
      const usable = Math.max(0.1, duration - leadIn - leadOut);
      let t = leadIn;
      wordTimings = words.map((w, i) => {
        const seg = (weights[i] / total) * usable;
        const start = t;
        t += seg;
        return { start, end: t, idx: i };
      });
      syncExact = false;
      updateSyncNote();
    }

    function updateWordHighlight(time) {
      if (!wordEls.length || !wordTimings.length) return;
      let activeIdx = -1;
      for (let i = 0; i < wordTimings.length; i++) {
        const wt = wordTimings[i];
        if (time >= wt.start && time < wt.end) { activeIdx = i; break; }
        if (time >= wt.end) activeIdx = i;
      }
      wordEls.forEach((el, i) => {
        el.classList.remove("active", "done", "pending");
        if (i < activeIdx) el.classList.add("done");
        else if (i === activeIdx) el.classList.add("active");
        else el.classList.add("pending");
      });
    }

    function updateUi() {
      const track = playlist[index];
      if (!track) return;
      const title = trackLabel(track, index);
      nowPlaying.textContent = title;
      $("compactTitle").textContent = `${surahTitle(track.surah)} · Ayah ${track.ayah}`;
      const meta = isSurahMode()
        ? `${surahTitle(track.surah)} · ${index + 1} of ${playlist.length} · ${MODES[mode].label}`
        : `Global ${track.global_id} · ${index + 1} of ${playlist.length} · ${MODES[mode].label}`;
      trackMeta.textContent = meta;
      $("compactMeta").textContent = meta;
      updateFullscreenMeta();
      renderList();
      renderAyahText(track);
      const activeRow = trackList.querySelector(".track.active");
      if (activeRow) activeRow.scrollIntoView({ block: "nearest" });
      if (usesSurahGroupedList()) highlightSurahNav(track.surah, true);
    }

    async function primeStandby(i) {
      if (isRevisionLike()) return;
      if (i >= playlist.length) return;
      standby.src = playlist[i].file;
      standby.load();
    }

    function loadActiveTrack() {
      const track = playlist[index];
      if (!track) return;
      if (loadedTrackIndex === index && active.src) return;
      active.src = track.file;
      active.currentTime = 0;
      active.onloadedmetadata = onAudioReady;
      loadedTrackIndex = index;
      active.load();
      primeStandby(index + 1);
    }

    function waitForActiveReady() {
      if (active.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
        return Promise.resolve();
      }
      if (active.error) {
        return Promise.reject(active.error);
      }
      return new Promise((resolve, reject) => {
        const cleanup = () => {
          active.removeEventListener("canplay", onReady);
          active.removeEventListener("error", onError);
        };
        const onReady = () => { cleanup(); resolve(); };
        const onError = () => { cleanup(); reject(new Error("audio load failed")); };
        active.addEventListener("canplay", onReady, { once: true });
        active.addEventListener("error", onError, { once: true });
      });
    }

    function waitForActiveEnded() {
      return new Promise((resolve, reject) => {
        const cleanup = () => {
          active.removeEventListener("ended", onEnd);
          active.removeEventListener("error", onErr);
        };
        const onEnd = () => { cleanup(); resolve(); };
        const onErr = () => { cleanup(); reject(new Error("audio ended with error")); };
        active.addEventListener("ended", onEnd, { once: true });
        active.addEventListener("error", onErr, { once: true });
      });
    }

    function isAudhuSource(src) {
      return typeof src === "string" && src.includes("audhubillah");
    }

    async function loadIntroSource(localFile, remoteUrl) {
      active.src = localFile;
      active.currentTime = 0;
      active.load();
      try {
        await waitForActiveReady();
        return;
      } catch (_) {}
      active.src = remoteUrl;
      active.currentTime = 0;
      active.load();
      await waitForActiveReady();
    }

    async function playIntroClip(localFile, remoteUrl, label, phase) {
      introPhase = phase;
      setIntroUi(label);
      loadedTrackIndex = -1;
      active.onloadedmetadata = () => {
        $("timeTotal").textContent = formatTime(active.duration);
      };
      await loadIntroSource(localFile, remoteUrl);
      await active.play();
      playing = true;
      updatePauseButtons();
      await waitForActiveEnded();
    }

    async function playSurahIntroChain(track) {
      if (!needsSurahIntro(track)) return;
      introInProgress = true;
      try {
        await playIntroClip(AUDHU_FILE, AUDHU_REMOTE, "A'udhu Billah", "audhu");
        if (track.surah !== 9) {
          await playIntroClip(BISMILLAH_FILE, BISMILLAH_REMOTE, "Bismillah", "bismillah");
        }
      } catch (_) {
        /* continue to ayah even if intro fails */
      } finally {
        introInProgress = false;
        introPhase = null;
        updateFullscreenMeta();
      }
    }

    async function playCurrentTrackWithIntro() {
      const track = playlist[index];
      if (!track) return;
      if (needsSurahIntro(track)) {
        await playSurahIntroChain(track);
      }
      loadActiveTrack();
      try {
        await waitForActiveReady();
        await active.play();
        playing = true;
      } catch (_) {
        playing = false;
      }
      updatePauseButtons();
    }

    async function startPlayback() {
      const track = playlist[index];
      if (!track) return;
      if (introInProgress && isIntroSource(active.src)) {
        try {
          await active.play();
          playing = true;
        } catch (_) {
          playing = false;
        }
        updatePauseButtons();
        return;
      }
      await playCurrentTrackWithIntro();
    }

    async function onAudioReady() {
      await computeWordTimings(active.duration);
      $("timeTotal").textContent = formatTime(active.duration);
      updateWordHighlight(active.currentTime);
    }

    async function playIndex(i, autoplay = true) {
      if (i < 0 || i >= playlist.length) return;
      index = i;
      currentSurah = playlist[index].surah;
      loadedTrackIndex = -1;
      updateUi();
      loadActiveTrack();
      if (autoplay) await startPlayback();
      else updatePauseButtons();
    }

    async function advanceToNext() {
      if (isSurahMode()) {
        reloadSurah(nextSurah(masterPlaylist, currentSurah));
        return;
      }
      await advanceTrackInQueue();
    }

    async function advanceTrackInQueue() {
      if (isRevisionLike()) {
        if (index + 1 >= playlist.length) { active.currentTime = 0; active.play(); return; }
        await playIndex(index + 1);
        return;
      }
      if (index + 1 >= playlist.length) {
        playing = false;
        active.pause();
        updatePauseButtons();
        return;
      }
      await playIndex(index + 1);
    }

    async function advanceToPrev() {
      if (isSurahMode()) {
        reloadSurah(prevSurah(masterPlaylist, currentSurah));
        return;
      }
      await playIndex(Math.max(0, index - 1));
    }

    async function onTrackEnded(event) {
      if (event.target !== active) return;
      if (introInProgress) return;
      if (isRevisionLike()) {
        active.currentTime = 0;
        try {
          await active.play();
          playing = true;
        } catch (_) { playing = false; }
        updatePauseButtons();
        return;
      }
      if (shouldLoopQueue()) {
        if (index + 1 >= playlist.length) {
          await playIndex(0);
        } else {
          await advanceTrackInQueue();
        }
        return;
      }
      if (index + 1 >= playlist.length) { playing = false; updatePauseButtons(); return; }
      await advanceTrackInQueue();
    }

    function onTimeUpdate(event) {
      if (event.target !== active || !active.duration) return;
      const pct = (active.currentTime / active.duration) * 100;
      seek.value = Math.round(pct * 10);
      $("timeNow").textContent = formatTime(active.currentTime);
      if (introInProgress) return;
      updateWordHighlight(active.currentTime);
    }

    audioA.addEventListener("ended", onTrackEnded);
    audioB.addEventListener("ended", onTrackEnded);
    audioA.addEventListener("timeupdate", onTimeUpdate);
    audioB.addEventListener("timeupdate", onTimeUpdate);

    seek.addEventListener("input", () => {
      if (!active.duration) return;
      active.currentTime = (seek.value / 1000) * active.duration;
      updateWordHighlight(active.currentTime);
    });

    $("playBtn").onclick = () => startPlayback();
    $("pauseBtn").onclick = () => {
      active.pause();
      playing = false;
      updatePauseButtons();
    };
    $("prevBtn").onclick = () => advanceToPrev();
    $("nextBtn").onclick = () => advanceToNext();
    $("textFullscreenBtn").onclick = () => enterTextFullscreen();
    $("fsExitBtn").onclick = () => exitTextFullscreen();
    $("fsPrevBtn").onclick = () => advanceToPrev();
    $("fsPauseBtn").onclick = () => togglePlayPause();
    $("fsNextBtn").onclick = () => advanceToNext();
    $("compactPlay").onclick = () => startPlayback();
    $("compactPrev").onclick = () => advanceToPrev();
    $("compactNext").onclick = () => advanceToNext();

    playerPanel.addEventListener("click", (event) => {
      if (!panelAdvances()) return;
      if (event.target.closest("button") || event.target.closest("#seek") || event.target.closest("#modeGrid")) return;
      advanceToNext();
    });

    ayahFullscreenBody.addEventListener("click", (event) => {
      if (!textFullscreen || !fullscreenTapAdvances()) return;
      if (event.target.closest(".ayah-fullscreen-controls") || event.target.closest("#ayahFullscreenMeta")) return;
      advanceToNext();
    });

    $("expandBtn").onclick = () => {
      playlistExpanded = !playlistExpanded;
      fullPlayerPanel.classList.toggle("hidden", playlistExpanded);
      compactBar.classList.toggle("hidden", !playlistExpanded);
      $("expandBtn").textContent = playlistExpanded ? "Collapse" : "Expand";
      renderList();
    };

    $("refreshBtn").onclick = () => renderList();

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && textFullscreen) {
        event.preventDefault();
        exitTextFullscreen();
      }
    });

    function initPlaylist(tracks) {
      tracks = mergeDefaultTracks(tracks || []);
      if (!tracks.length) {
        loadStatus.textContent = "No tracks in playlist.";
        return;
      }
      masterPlaylist = tracks.map((t, i) => ({ ...t, index: i + 1 }));
      mode = "continuous";
      currentSurah = masterPlaylist[0]?.surah || 1;
      updateModeUi();
      setActiveQueue(masterPlaylist, 0);
      $("loadPanel").classList.add("hidden");
      mainUi.classList.remove("hidden");
      loadStatus.textContent = `Loaded ${masterPlaylist.length} learned ayahs.`;
      nowPlaying.textContent = "Ready — press Play";
    }

    $("useEmbeddedBtn").onclick = () => {
      const data = JSON.parse($("playlist-data").textContent);
      initPlaylist(data.tracks || []);
    };

    $("libraryFile").onchange = async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      loadStatus.textContent = `Reading ${file.name}…`;
      try {
        const json = JSON.parse(await file.text());
        const ayahs = parseLibraryJson(json);
        if (!ayahs.length) throw new Error("No learned ayahs found");
        initPlaylist(ayahs);
      } catch (err) {
        loadStatus.textContent = err.message || "Failed to read library file";
      }
    };

    function parseLibraryJson(data) {
      const VERSE = VERSE_COUNTS;
      function globalToSurahAyah(gid) {
        let rem = gid;
        for (let s = 0; s < VERSE.length; s++) {
          if (rem <= VERSE[s]) return [s + 1, rem];
          rem -= VERSE[s];
        }
        throw new Error("Invalid ayah id");
      }
      const folders = (data.folders || []).filter(f => !f.is_deleted && (f.title || "").includes("Every Learned Ayah"));
      const folderIds = new Set(folders.map(f => f.id));
      const items = (data.items || []).filter(it => !it.is_deleted && folderIds.has(it.folder_id));
      const seen = new Set();
      const ayahs = [];
      for (const item of items.sort((a, b) => (a.custom_order || 0) - (b.custom_order || 0))) {
        const gid = item.id;
        if (seen.has(gid)) continue;
        seen.add(gid);
        const [surah, ayah] = globalToSurahAyah(gid);
        ayahs.push({
          global_id: gid, surah, ayah,
          label: `Surah ${surah} : Ayah ${ayah}`,
          file: ayahFile(surah, ayah),
        });
      }
      ayahs.sort((a, b) => a.global_id - b.global_id);
      return mergeDefaultTracks(ayahs);
    }

    // Load built-in playlist immediately (do not wait for quran text).
    try {
      const data = JSON.parse($("playlist-data").textContent);
      if (data.tracks?.length) initPlaylist(data.tracks);
    } catch (err) {
      loadStatus.textContent = "Could not read built-in playlist — use Pick file.";
    }

    loadQuranText();
    loadWordTimings().then(() => {
      if (playlist[index]) {
        renderAyahText(playlist[index]);
        if (active.duration) onAudioReady();
      }
    });
    updatePauseButtons();
  </script>
</body>
</html>
