name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · unit tests & debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app-quran-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Also validates gradle/wrapper/gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android-app-quran-player/app/build/reports/tests/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android-app-quran-player/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  web:
    name: Web player · generate from sample library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-app-quran-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m py_compile play_learned_ayahs.py

      - name: Generate player offline from the sample library
        run: |
          # Placeholder intro clips so the script doesn't reach out to everyayah.com.
          mkdir -p audio/MaherAlMuaiqly128kbps
          touch audio/MaherAlMuaiqly128kbps/audhubillah.mp3 audio/MaherAlMuaiqly128kbps/bismillah.mp3
          python play_learned_ayahs.py --skip-download --skip-text --skip-timings --no-open
          python - <<'EOF'
          import json
          html = open("player.html", encoding="utf-8").read()
          assert "__PLAYLIST__" not in html, "playlist was not injected"
          playlist = json.load(open("learned_ayahs_playlist.json", encoding="utf-8"))
          assert playlist["source"] == "sample_library.json", playlist["source"]
          ids = [t["global_id"] for t in playlist["tracks"]]
          assert ids == sorted(set(ids)), "playlist must be ordered and duplicate-free"
          assert {1, 262, 6222}.issubset(ids), "sample ayahs missing"
          print(f"OK: {len(ids)} tracks")
          EOF
