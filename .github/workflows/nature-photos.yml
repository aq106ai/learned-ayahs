name: Nature photos

# Gathers the CC0 nature photos "Share as video" offers, from Wikimedia Commons, in two steps:
#   candidates — search and filter, commit contact sheets to backgrounds/candidates/ for review;
#   finalize   — once backgrounds/selected.json lists the keepers, fetch them into backgrounds/nature/.
# Pushing a change to selected.json runs finalize; anything else runs candidates.
on:
  workflow_dispatch:
    inputs:
      step:
        description: candidates or finalize
        default: candidates
  push:
    branches-ignore: [main, dev]
    paths:
      - .github/workflows/nature-photos.yml
      - backgrounds/fetch_nature_photos.py
      - backgrounds/selected.json

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Pick the step
        id: step
        run: |
          step="${{ github.event.inputs.step }}"
          if [ -z "$step" ]; then
            if git diff --name-only HEAD~1 HEAD | grep -q '^backgrounds/selected.json$'; then step=finalize; else step=candidates; fi
          fi
          echo "step=$step" >> "$GITHUB_OUTPUT"

      - run: python backgrounds/fetch_nature_photos.py ${{ steps.step.outputs.step }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backgrounds
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Nature photos: ${{ steps.step.outputs.step }} at ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
