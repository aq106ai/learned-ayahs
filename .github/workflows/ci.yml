name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · unit tests & debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app-quran-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Also validates gradle/wrapper/gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      # The timing audit's verdicts (timing-audit.yml) must be in the assets the app ships.
      - name: Word timings carry the audit's fixes
        run: python3 .setup/apply_timing_fixes.py --check

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Shrunk and obfuscated by R8, signed with the debug key (there is no keystore here).
      - name: Build release APK (R8)
        run: ./gradlew assembleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android-app-quran-player/app/build/reports/tests/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android-app-quran-player/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  web-app:
    name: Web app · unit, server & browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Video themes match the Android app's
        run: python3 tools/sync_video_themes.py --check

      - name: Unit tests (ported logic)
        run: npm test

      - name: Server tests
        run: npm run test:server

      - name: Browser tests (Playwright)
        timeout-minutes: 15
        # Failures become annotations, so the failing test and its error show on the run's
        # summary page (logs need a GitHub sign-in; annotations are readable by anyone).
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log || {
            # Each failing test's TAP block, from "not ok" to the next test, one annotation each.
            awk '{gsub(/%/, "%25")}
                 on && /^(ok |not ok |# Subtest)/{print b; on=0}
                 /^not ok /{b=$0; on=1; next}
                 on && length(b) < 3000 {b=b "%0A" $0}
                 END{if(on) print b}' e2e.log \
              | while IFS= read -r block; do echo "::error title=Browser test failed::$block"; done
            exit 1
          }
