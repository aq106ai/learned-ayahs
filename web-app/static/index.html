<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Learned Ayahs</title>
    <meta name="description" content="Revise the ayahs of the Qur'an you have memorised: listen, repeat, follow word by word and recite." />
    <meta name="theme-color" content="#0A1710" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div class="app" id="app">
      <aside class="sidebar" aria-label="Main">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Learned Ayahs</span>
        </a>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <main class="view" id="view" tabindex="-1">
        <div class="boot">
          <div class="spinner" aria-hidden="true"></div>
          <p>Loading the Qur'an text…</p>
        </div>
      </main>
      <div class="mini-player" id="mini-player" hidden></div>
      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <noscript>Learned Ayahs needs JavaScript to run.</noscript>
  </body>
</html>
